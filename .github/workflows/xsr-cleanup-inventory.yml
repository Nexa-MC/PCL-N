name: XSR read-only cleanup inventory

on:
  push:
    branches: [audit/xsr-cleanup-inventory-24a97b9b]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the frozen source, not the audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 24a97b9b45d4652b755ad2edbe897928fde543f5
          persist-credentials: false
      - name: Export tracked source without changing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xsr-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/xsr-audit/source-commit.txt"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/xsr-audit/source-24a97b9b.zip"
      - name: Bundle pinned C-sharp parser wheels for offline audit
        shell: bash
        run: |
          python3 -m pip download --only-binary=:all: --python-version 3.13 --dest "$RUNNER_TEMP/xsr-audit/parser-wheels" tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.5
      - name: Retain the frozen-source audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xsr-cleanup-inventory-24a97b9b
          path: ${{ runner.temp }}/xsr-audit/
          retention-days: 3
          if-no-files-found: error
