name: One-time NexaCL Alpha 8 publication
on:
  push:
    branches: [ci/migrate-nexacl-8ea8b7405620]
    paths:
      - '.github/workflows/nexacl-migrate-once.yml'
      - 'eng/migration/nexacl_once.py'
permissions:
  contents: read
concurrency:
  group: one-time-nexacl-migration
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Nexa-MC/PCL-N'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TRANSFER_BRANCH: ci/migrate-nexacl-8ea8b7405620
      TRANSFER_NONCE: 5db0f489afd15efe6169c23b0e357eab
      TRANSFER_SOURCE_SHA: e2e2c6b8e0259b6c6b3dc6450d1ee2fe1f92a611
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare ephemeral credential transport
        run: python3 eng/migration/nexacl_once.py prepare
      - name: Publish only the run-bound transport public key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexacl-alpha8-transfer-public-5db0f489afd15efe6169c23b0e357eab
          path: ${{ runner.temp }}/nexacl-transfer/public/*
          retention-days: 1
          if-no-files-found: error
      - name: Verify source CI, await signed Alpha 8 and mirror, then archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 eng/migration/nexacl_once.py publish
      - name: Remove ephemeral transport private key
        if: always()
        run: rm -f "$RUNNER_TEMP/nexacl-transfer/transport-private.pem"
